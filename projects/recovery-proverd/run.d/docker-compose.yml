services:
  guest-attestation:
    # Collect boot and TLS evidence for Caddy to serve from /srv.
    image: guest-attestation
    restart: "no"
    env_file:
      - ./.guest-attestation.env
    volumes:
      - static_attestation:/srv
      - /root/application_disk_root_hash:/application_disk_root_hash
    devices:
      - /dev/tpmrm0:/dev/tpmrm0
    networks:
      - constrained-attestation

  caddy:
    image: caddy
    restart: unless-stopped
    extra_hosts:
      - "attestation:host-gateway"
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile.generated:/etc/caddy/Caddyfile:ro
      - ${TEMENOS_TLS_CERTS_DIR:-./certs}:/certs:ro
      - static_attestation:/srv
      - caddy_data:/data
      - caddy_config:/config
    networks:
      internet-access: {}
      constrained-attestation:
        # Bind the control API to this private network.
        aliases:
          - caddy-in-constrained-attestation-generator-network
      constrained-app: {}

  app:
    # The build re-tags the pulled app_container_image (from metadata.json) to
    # this fixed internal tag, so leave it as-is.
    image: dapp:tee
    restart: unless-stopped
    # Loopback-only publish for the host attestation server's decrypt-and-forward
    # /proxy hop. Select the endpoint path with DAPP_UPSTREAM_URL, e.g.
    # http://127.0.0.1:8080/prove.
    ports:
      - "127.0.0.1:8080:8443"
    read_only: true
    tmpfs:
      # Scratch space; the image rootfs is read-only (dm-verity) and the prover
      # does not persist to disk. Remove if the app needs no writable path at all.
      - /tmp
    networks:
      # constrained-app only: no outbound internet. The prover receives requests
      # via Caddy and returns proofs; it needs no egress. If it ever must reach
      # an external HTTPS service, declare the destination in metadata.json;
      # Temenos injects the measured hostname proxy automatically.
      - constrained-app

volumes:
  caddy_data:
  caddy_config:
  static_attestation:


networks:
  # The network config is a bit complicated because we want to :
  # * remove internet access (inbound and outbound) from every container except for the reverse proxy
  # * allow access to the caddy admin endpoint only to the guest-attestation (and not to the app)

  # internet access has not the "internal: true" attribute so it will be exposed to the internet
  # only caddy is in this network
  internet-access:
    driver: bridge

  # Network with the guest-attestation and caddy.
  # No internet access
  constrained-attestation:
    driver: bridge
    internal: true

  # Network with the app and caddy.
  # No internet access
  constrained-app:
    driver: bridge
    internal: true
