services:
  guest-attestation:
    image: guest-attestation
    restart: "no"
    env_file:
      - ./.guest-attestation.env
    volumes:
      - static_attestation:/srv
      - /root/application_disk_root_hash:/application_disk_root_hash
    devices:
      - /dev/tpmrm0:/dev/tpmrm0
    networks:
      - constrained-attestation

  persist-init:
    image: dapp:tee
    restart: "no"
    user: "0:0"
    network_mode: "none"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        mkdir -p /data
        chown 10001:10001 /data
        chmod 0700 /data
    volumes:
      - /mnt/persist/mpc-node:/data

  caddy:
    image: caddy
    restart: unless-stopped
    depends_on:
      persist-init:
        condition: service_completed_successfully
    extra_hosts:
      - "attestation:host-gateway"
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile.generated:/etc/caddy/Caddyfile:ro
      - ${TEMENOS_TLS_CERTS_DIR:-./certs}:/certs:ro
      - static_attestation:/srv
      - caddy_data:/data
      - caddy_config:/config
    networks:
      internet-access: {}
      constrained-attestation:
        aliases:
          - caddy-in-constrained-attestation-generator-network
      constrained-app: {}

  app:
    image: dapp:tee
    restart: unless-stopped
    depends_on:
      persist-init:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - /mnt/persist/mpc-node:/data
    networks:
      - constrained-app

volumes:
  caddy_data:
  caddy_config:
  static_attestation:

networks:
  internet-access:
    driver: bridge

  constrained-attestation:
    driver: bridge
    internal: true

  constrained-app:
    driver: bridge
    internal: true
