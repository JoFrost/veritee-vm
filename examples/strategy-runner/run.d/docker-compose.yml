services:
  guest-attestation:
    image: guest-attestation
    restart: "no"
    env_file:
      - ./.guest-attestation.env
    volumes:
      - static_attestation:/srv
      - /root/application_disk_root_hash:/application_disk_root_hash
    devices:
      - /dev/tpmrm0:/dev/tpmrm0
    networks:
      - constrained-attestation

  persist-init:
    image: dapp:tee
    restart: "no"
    user: "0:0"
    network_mode: "none"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        mkdir -p /var/lib/strategy-runner/.well-known
        chown 65532:65532 /var/lib/strategy-runner /var/lib/strategy-runner/.well-known
        chmod 0755 /var/lib/strategy-runner /var/lib/strategy-runner/.well-known
    volumes:
      - /mnt/persist:/var/lib/strategy-runner

  caddy:
    image: caddy
    restart: unless-stopped
    depends_on:
      persist-init:
        condition: service_completed_successfully
    extra_hosts:
      - "attestation:host-gateway"
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile.generated:/etc/caddy/Caddyfile:ro
      - ${TEMENOS_TLS_CERTS_DIR:-./certs}:/certs:ro
      - static_attestation:/srv
      - /mnt/persist/.well-known:/srv/.well-known:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      internet-access: {}
      constrained-attestation:
        aliases:
          - caddy-in-constrained-attestation-generator-network
      constrained-app: {}

  app:
    image: dapp:tee
    restart: unless-stopped
    depends_on:
      persist-init:
        condition: service_completed_successfully
    # Loopback-only publish for the host attestation server's decrypt-and-forward
    # /proxy hop. Select the endpoint path with DAPP_UPSTREAM_URL, e.g.
    # http://127.0.0.1:8080/run.
    ports:
      - "127.0.0.1:8080:80"
    environment:
      ATTESTATION_SERVER_URL: "http://attestation:8000"
      DEMO_CHAIN_ID: "31337"
      DEMO_EXECUTOR_ADDRESS: "0x000000000000000000000000000000000000dEaD"
      STRATEGY_RUNNER_KEY_DIR: "/var/lib/strategy-runner"
      TEE_PRIVATE_KEY_FILE: "/var/lib/strategy-runner/strategy_runner_x25519_private_key"
      STRATEGY_RUNNER_PUBLIC_KEY_FILE: "/var/lib/strategy-runner/.well-known/strategy-runner-key.json"
    extra_hosts:
      - "attestation:host-gateway"
    volumes:
      - /mnt/persist:/var/lib/strategy-runner
    networks:
      - constrained-app

volumes:
  caddy_data:
  caddy_config:
  static_attestation:

networks:
  internet-access:
    driver: bridge

  constrained-attestation:
    driver: bridge
    internal: true

  constrained-app:
    driver: bridge
    internal: true
