[pytest]
# Keep this test suite self-contained: import test modules standalone so the
# `cli` / `veritee` package __init__ (full CLI deps: typer, rich, …)
# is not imported during collection. Only `cryptography` (+ optional `requests`)
# is needed to exercise the attested-channel client.
addopts = --import-mode=importlib
consider_namespace_packages = false
