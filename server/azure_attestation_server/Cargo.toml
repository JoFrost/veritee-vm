[package]
name = "attestation_server"
version = "0.2.0"
edition = "2021"
license = "Apache-2.0"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
akx = { path = "../akx" }
anyhow = "1.0.86"
az-snp-vtpm = { version = "0.8.1", optional = true }
az-cvm-vtpm = { version = "0.8.1", default-features = false }
axum = {version="0.7.5", features=["macros"]}
base64 = "0.22.1"
bincode = "1.3.3"
binrw = "0.14.0"
env_logger = "0.11.3"
fn-error-context = "0.2.1"
jsonwebtoken = "=9.3.0"
log = "0.4.22"
memoffset = "0.9.1"
reqwest = { version="0.12.5", default-features= false, features = ["rustls-tls", "json"] }
ring = "0.17.8"
rustls-webpki = "0.102.5"
serde = { version = "1.0.195", features = ["derive"] }
serde-big-array = "0.5.1"
serde_json = "1.0.120"
sev = "7"
tempfile = "3.10.1"
thiserror = "1.0.61"
tokio = { version ="1.38.0", features=["full"]}
tss-esapi = "7.5.1"
webpki-roots = "0.26.3"

[features]
default = ["maa"]
raw-report = ["dep:az-snp-vtpm"]
maa = []
dev-unbound-attestation = []
