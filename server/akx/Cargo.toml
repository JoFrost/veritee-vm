[package]
name = "akx"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Attested key-exchange (AKX) crypto core for the Veritee attested channel"

# Deliberately free of any TPM / SEV-SNP / HTTP dependencies so the crypto core
# builds and is fully unit-testable on any platform (incl. CI without a TEE).

[dependencies]
aes-gcm = "0.10.3"
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
hpke = "0.12.0"
rand = "0.8.5"
sha2 = "0.10.8"
thiserror = "1.0.61"

[dev-dependencies]
hex = "0.4.3"
# Used only by the `enclave_stub` interop example (Python client pytest harness).
base64 = "0.22"
serde_json = "1"

[[example]]
name = "enclave_stub"
